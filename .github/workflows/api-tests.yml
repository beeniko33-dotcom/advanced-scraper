name: API tests

on:
  pull_request:
    paths:
      - "api_server.py"
      - "advanced_scraper.py"
      - "orchestrator.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/api-tests.yml"
  push:
    branches:
      - main
      - "security/**"
    paths:
      - "api_server.py"
      - "advanced_scraper.py"
      - "orchestrator.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api-dev.txt
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-api-dev.txt
      - name: Run API regression tests
        run: python -m pytest -q
